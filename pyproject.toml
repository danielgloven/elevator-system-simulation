[project]
name = "elevator-sim"
version = "0.1.0"
description = "Discrete-time Destination Dispatch elevator system simulation"
readme = "README.md"
requires-python = ">=3.12"
# The core simulation intentionally has NO runtime dependencies (stdlib only).
dependencies = []

[project.optional-dependencies]
# Optional plotting support: `uv sync --extra viz` (or it's included in dev).
viz = ["matplotlib>=3.5"]

[project.scripts]
elevator-sim = "elevator_sim.cli:main"

[dependency-groups]
# Everything needed for development/tests/plots: `uv sync` installs these.
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "ruff>=0.15.16",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.3.0",
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elevator_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=elevator_sim --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["elevator_sim"]
# viz.py is exercised in the smoke run, not unit tests; exclude from the gate.
omit = ["*/viz.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear,
# SIM simplify, C4 comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.bandit]
# Scan application code only; tests legitimately use asserts (B101).
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# matplotlib ships no type stubs; don't fail on its untyped imports.
module = "matplotlib.*"
ignore_missing_imports = true
