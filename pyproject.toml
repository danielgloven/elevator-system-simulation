[project]
name = "elevator-sim"
version = "0.1.0"
description = "Discrete-time Destination Dispatch elevator system simulation"
readme = "README.md"
requires-python = ">=3.9"
# The core simulation intentionally has NO runtime dependencies (stdlib only).
dependencies = []

[project.optional-dependencies]
# Optional plotting support: `uv sync --extra viz` (or it's included in dev).
viz = ["matplotlib>=3.5"]

[project.scripts]
elevator-sim = "elevator_sim.cli:main"

[dependency-groups]
# Everything needed for development/tests/plots: `uv sync` installs these.
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elevator_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
